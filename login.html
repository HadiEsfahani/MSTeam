<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ورود — دفتر اندیکاتور نامه‌ها</title>
  <link rel="stylesheet" href="login.css?v=2" />
</head>
<body class="login-body">

  <div class="login-stage">
    <div class="login-content">
      <img src="assets/logo.webp?v=2" alt="MST Co." class="login-logo" width="230" />

      <div class="login-card" id="loginCard">
        <form id="loginForm" class="login-form" autocomplete="off">
          <div class="login-heading">
            <span class="login-heading-line"></span>
            <h1>ورود به سامانه</h1>
          </div>

          <div class="login-field">
            <label for="username">نام کاربری</label>
            <input type="text" id="username" name="username" autocomplete="username" required />
          </div>

          <div class="login-field">
            <label for="password">رمز عبور</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required />
          </div>

          <p id="loginError" class="login-error" hidden>نام کاربری یا رمز عبور اشتباه است.</p>

          <button type="submit" class="login-btn">
            <span>ورود</span>
          </button>
        </form>
      </div>
    </div>
  </div>

  <!-- Supabase (بررسی نام کاربری/رمز عبور از طریق دیتابیس) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="login.js"></script>
</body>
</html>
